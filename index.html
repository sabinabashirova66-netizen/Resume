<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Заявка на комнату</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
<h1>Заявка на комнату</h1>
<p class="subtitle">Проверка возможности заселения студента</p>
<form id="applicationForm">
<label for="studentId">ID студента</label>
<input type="number" id="studentId" min="1" placeholder="Например: 3" required>
<label for="buildingNumber">Номер корпуса</label>
<input type="number" id="buildingNumber" min="1" placeholder="Например: 2" required>
<label for="roomNumber">Номер комнаты</label>
<input type="number" id="roomNumber" min="1" placeholder="Например: 102" required>
<button type="submit">Проверить</button>
</form>
<div id="result" class="result hidden"></div>
</main>
<script src="script.js"></script>
</body>
</html>
