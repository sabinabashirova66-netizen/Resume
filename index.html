<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Доска объявлений</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div>
        <p class="eyebrow">Веб-технологии</p>
        <h1>Доска объявлений</h1>
        <p class="subtitle">Просматривай объявления и добавляй новые.</p>
      </div>
      <button id="refreshBtn" class="secondary-btn" type="button">Обновить список</button>
    </div>
  </header>

  <main class="container layout">
    <section class="panel form-panel" aria-labelledby="formTitle">
      <div class="section-heading">
        <div>
          <p class="eyebrow">POST /ads</p>
          <h2 id="formTitle">Добавить объявление</h2>
        </div>
      </div>

      <form id="adForm" enctype="multipart/form-data">
        <label>
          Заголовок
          <input id="title" name="title" type="text" maxlength="100" placeholder="Например: Продаю ноутбук" required />
        </label>

        <label>
          Описание
          <textarea id="description" name="description" rows="5" maxlength="1000" placeholder="Опиши товар или предложение" required></textarea>
        </label>

        <label>
          Цена
          <input id="price" name="price" type="number" min="0" step="0.01" placeholder="30000" required />
        </label>

        <label>
          Изображение
          <input id="image" name="image" type="file" accept="image/*" />
        </label>

        <div id="previewWrap" class="preview-wrap hidden">
          <img id="previewImage" alt="Предпросмотр выбранного изображения" />
        </div>

        <button id="submitBtn" class="primary-btn" type="submit">Опубликовать</button>
        <p id="formMessage" class="message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="panel ads-panel" aria-labelledby="adsTitle">
      <div class="section-heading ads-heading">
        <div>
          <p class="eyebrow">GET /ads</p>
          <h2 id="adsTitle">Список объявлений</h2>
        </div>
        <span id="adsCount" class="count-badge">0</span>
      </div>

      <div id="loading" class="state-box">Загрузка объявлений...</div>
      <div id="errorBox" class="state-box error hidden"></div>
      <div id="adsList" class="ads-grid"></div>
    </section>
  </main>

  <template id="adCardTemplate">
    <article class="ad-card">
      <div class="image-box">
        <img class="ad-image" alt="" />
        <div class="no-image">Нет изображения</div>
      </div>
      <div class="ad-content">
        <div class="ad-meta">
          <span class="ad-id"></span>
          <strong class="ad-price"></strong>
        </div>
        <h3 class="ad-title"></h3>
        <p class="ad-description"></p>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
